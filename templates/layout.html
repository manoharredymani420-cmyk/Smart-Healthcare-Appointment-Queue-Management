<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MediCare — Smart Healthcare Appointment & Queue Platform{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
        <div class="container">
            <a class="navbar-brand text-primary" href="/">
                <i class="bi bi-hospital me-1"></i>Medi<span>Care</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0" id="nav-links">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <!-- Role-specific links injected via JS -->
                </ul>
                <div class="d-flex align-items-center" id="nav-user-info">
                    <a href="/login" class="btn btn-outline-primary btn-sm me-2">Sign In</a>
                    <a href="/register" class="btn btn-primary btn-sm">Register</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="py-4 flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="mt-auto">
        <div class="container text-center">
            <p class="mb-1"><strong>MediCare Platform</strong> — Smart Healthcare Appointment & Queue Management</p>
            <p class="small text-muted mb-0">Portfolio Project &copy; 2026. Built with Python, Flask, PostgreSQL / SQLite & Machine Learning.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/api.js"></script>
    <script>
        // Update nav links according to logged-in user
        document.addEventListener('DOMContentLoaded', () => {
            const user = API.getUser();
            const navLinks = document.getElementById('nav-links');
            if (user && navLinks) {
                if (user.role === 'patient') {
                    navLinks.innerHTML = `
                        <li class="nav-item"><a class="nav-link" href="/patient/dashboard"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link" href="/patient/book-appointment"><i class="bi bi-calendar-plus me-1"></i>Book Appointment</a></li>
                        <li class="nav-item"><a class="nav-link" href="/patient/appointments"><i class="bi bi-calendar-check me-1"></i>My Appointments</a></li>
                        <li class="nav-item"><a class="nav-link" href="/patient/queue"><i class="bi bi-ticket-perforated me-1"></i>Digital Queue</a></li>
                        <li class="nav-item"><a class="nav-link" href="/patient/records"><i class="bi bi-file-earmark-medical me-1"></i>Medical Records</a></li>
                    `;
                } else if (user.role === 'doctor') {
                    navLinks.innerHTML = `
                        <li class="nav-item"><a class="nav-link" href="/doctor/dashboard"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link" href="/doctor/appointments"><i class="bi bi-calendar-check me-1"></i>Appointments</a></li>
                        <li class="nav-item"><a class="nav-link" href="/doctor/queue"><i class="bi bi-people me-1"></i>Queue Manager</a></li>
                    `;
                } else if (user.role === 'admin') {
                    navLinks.innerHTML = `
                        <li class="nav-item"><a class="nav-link" href="/admin/dashboard"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link" href="/admin/analytics"><i class="bi bi-graph-up me-1"></i>Analytics</a></li>
                        <li class="nav-item"><a class="nav-link" href="/admin/doctors"><i class="bi bi-person-badge me-1"></i>Doctors</a></li>
                        <li class="nav-item"><a class="nav-link" href="/admin/departments"><i class="bi bi-building me-1"></i>Departments</a></li>
                        <li class="nav-item"><a class="nav-link" href="/admin/users"><i class="bi bi-people me-1"></i>Users</a></li>
                    `;
                }
            }
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
