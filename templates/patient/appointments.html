{% extends "layout.html" %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-1"><i class="bi bi-calendar-check text-primary me-2"></i>My Appointments</h3>
            <p class="text-muted mb-0">View all your upcoming and past clinic visits</p>
        </div>
        <a href="/patient/book-appointment" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i> New Booking</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Token</th>
                            <th>Doctor & Specialty</th>
                            <th>Date & Time</th>
                            <th>Status</th>
                            <th>Estimated Wait</th>
                            <th>Reason</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="appts-tbody">
                        <tr><td colspan="7" class="text-center py-4 text-muted">Loading appointments...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', async () => {
    if (!API.requireAuth('patient')) return;
    loadAppointments();
});

async function loadAppointments() {
    const tbody = document.getElementById('appts-tbody');
    try {
        const res = await API.get('/api/patients/me/appointments');
        const list = res.data || [];

        if (list.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">You have no appointment records.</td></tr>';
            return;
        }

        tbody.innerHTML = list.map(a => `
            <tr>
                <td class="fw-bold text-primary">${a.token_number}</td>
                <td>
                    <div class="fw-semibold">${a.doctor_name || 'Assigned Doctor'}</div>
                    <small class="text-muted">${a.department_name || 'General'}</small>
                </td>
                <td>
                    <div>${a.appointment_date}</div>
                    <small class="text-muted">${a.appointment_time}</small>
                </td>
                <td><span class="badge badge-${a.status.toLowerCase()}">${a.status}</span></td>
                <td>
                    ${['BOOKED', 'CONFIRMED', 'WAITING'].includes(a.status) 
                        ? `<span class="fw-bold text-dark">${a.estimated_wait_minutes || 0} mins</span> <small class="text-muted">(${a.patients_ahead || 0} ahead)</small>` 
                        : '<span class="text-muted">--</span>'}
                </td>
                <td><small class="text-muted">${a.reason || 'None'}</small></td>
                <td>
                    <div class="btn-group btn-group-sm">
                        ${['BOOKED', 'CONFIRMED', 'WAITING'].includes(a.status) ? `
                            <a href="/patient/queue" class="btn btn-outline-primary">Track</a>
                            <button class="btn btn-outline-danger" onclick="cancelAppt(${a.id})">Cancel</button>
                        ` : `
                            <span class="text-muted small">Completed / Closed</span>
                        `}
                    </div>
                </td>
            </tr>
        `).join('');
    } catch (err) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4">${err.message}</td></tr>`;
    }
}

async function cancelAppt(id) {
    if (!confirm("Are you sure you want to cancel this appointment?")) return;
    try {
        await API.delete(`/api/appointments/${id}`);
        alert("Appointment cancelled successfully");
        loadAppointments();
    } catch (err) {
        alert("Cancellation failed: " + err.message);
    }
}
</script>
{% endblock %}
