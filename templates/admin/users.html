{% extends "layout.html" %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-1"><i class="bi bi-people text-primary me-2"></i>User Management</h3>
            <p class="text-muted mb-0">System user directory, role permissions, and access status</p>
        </div>
        <div class="d-flex gap-2">
            <select id="role-filter" class="form-select form-select-sm" onchange="loadUsers()">
                <option value="">All Roles</option>
                <option value="patient">Patients</option>
                <option value="doctor">Doctors</option>
                <option value="admin">Admins</option>
            </select>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email Address</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Created Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="users-tbody">
                        <tr><td colspan="7" class="text-center py-4 text-muted">Loading users...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => {
    if (!API.requireAuth('admin')) return;
    loadUsers();
});

async function loadUsers() {
    const roleFilter = document.getElementById('role-filter').value;
    const tbody = document.getElementById('users-tbody');
    let url = '/api/users';
    if (roleFilter) url += `?role=${roleFilter}`;

    try {
        const res = await API.get(url);
        const list = res.data || [];

        if (list.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">No users found.</td></tr>';
            return;
        }

        tbody.innerHTML = list.map(u => `
            <tr>
                <td class="fw-bold">#${u.id}</td>
                <td class="fw-semibold">${u.name}</td>
                <td>${u.email}</td>
                <td><span class="badge bg-primary-subtle text-primary border">${u.role.toUpperCase()}</span></td>
                <td>
                    <span class="badge ${u.is_active ? 'bg-success' : 'bg-danger'}">
                        ${u.is_active ? 'Active' : 'Disabled'}
                    </span>
                </td>
                <td><small class="text-muted">${u.created_at ? u.created_at.split('T')[0] : 'N/A'}</small></td>
                <td>
                    <button class="btn btn-sm ${u.is_active ? 'btn-outline-danger' : 'btn-outline-success'}" onclick="toggleStatus(${u.id})">
                        ${u.is_active ? 'Deactivate' : 'Activate'}
                    </button>
                </td>
            </tr>
        `).join('');

    } catch (err) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4">${err.message}</td></tr>`;
    }
}

async function toggleStatus(userId) {
    try {
        await API.put(`/api/users/${userId}/toggle-status`, {});
        loadUsers();
    } catch (err) {
        alert("Failed to change user status: " + err.message);
    }
}
</script>
{% endblock %}
