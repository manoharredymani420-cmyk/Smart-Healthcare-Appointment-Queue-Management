{% extends "layout.html" %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-1"><i class="bi bi-building text-primary me-2"></i>Department Management</h3>
            <p class="text-muted mb-0">Medical departments, clinic units, and assigned physician counts</p>
        </div>
        <button class="btn btn-primary btn-sm" onclick="openCreateDeptModal()">
            <i class="bi bi-plus-lg me-1"></i> Add Department
        </button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Department Name</th>
                            <th>Description</th>
                            <th>Assigned Doctors</th>
                            <th>Created At</th>
                        </tr>
                    </thead>
                    <tbody id="depts-tbody">
                        <tr><td colspan="5" class="text-center py-4 text-muted">Loading departments...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal: Create Department -->
<div class="modal fade" id="deptModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">New Medical Department</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Department Name</label>
                    <input type="text" id="dept-name" class="form-control" placeholder="e.g. Neurology" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Description</label>
                    <textarea id="dept-desc" class="form-control" rows="3" placeholder="Description of care..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="submitNewDept()">Create Department</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let deptModalInstance = null;

document.addEventListener('DOMContentLoaded', () => {
    if (!API.requireAuth('admin')) return;
    deptModalInstance = new bootstrap.Modal(document.getElementById('deptModal'));
    loadDepartments();
});

async function loadDepartments() {
    const tbody = document.getElementById('depts-tbody');
    try {
        const res = await API.get('/api/departments');
        const list = res.data || [];

        if (list.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">No departments found.</td></tr>';
            return;
        }

        tbody.innerHTML = list.map(d => `
            <tr>
                <td class="fw-bold">#${d.id}</td>
                <td class="fw-semibold text-primary">${d.name}</td>
                <td><small class="text-muted">${d.description || 'No description'}</small></td>
                <td><span class="badge bg-secondary">${d.doctor_count || 0} Doctors</span></td>
                <td><small class="text-muted">${d.created_at ? d.created_at.split('T')[0] : 'N/A'}</small></td>
            </tr>
        `).join('');

    } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger py-4">${err.message}</td></tr>`;
    }
}

function openCreateDeptModal() {
    document.getElementById('dept-name').value = '';
    document.getElementById('dept-desc').value = '';
    deptModalInstance.show();
}

async function submitNewDept() {
    const name = document.getElementById('dept-name').value.trim();
    const description = document.getElementById('dept-desc').value.trim();

    if (!name) {
        alert("Department name is required");
        return;
    }

    try {
        await API.post('/api/departments', { name, description });
        deptModalInstance.hide();
        loadDepartments();
    } catch (err) {
        alert("Error creating department: " + err.message);
    }
}
</script>
{% endblock %}
